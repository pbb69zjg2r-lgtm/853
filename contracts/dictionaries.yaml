schema_version: "0.2.0"
contract_version: "2026-06-26"
description: "Central dictionaries for mitochondrial thermogenesis literature evidence extraction. Design informed by EvidenceNet (2603.28325v1) and Mistral-OCR pipeline (s12874-026-02847-8) patterns."

# ============================================================
# Section type — standardized IMRaD section classification.
# ============================================================
section_type:
  - preamble
  - title
  - abstract
  - introduction
  - methods
  - results
  - discussion
  - conclusion
  - supplementary
  - back_matter
  - references
  - body

# ============================================================
# Evidence type — what kind of finding is this evidence unit?
# Closed enum: these 7 types define the current extraction scope.
# ============================================================
evidence_type:
  - disease_association
  - detection_method
  - thermogenesis_modulation
  - biomarker_panel
  - mechanism_pathway
  - pathway_cellular_function_impact
  - organelle_interaction_impact

# ============================================================
# Entity type — semantic class of extracted biomedical entities.
# Closed enum: stable semantic categories.
# ============================================================
entity_type:
  - disease
  - protein
  - gene
  - metabolite
  - drug
  - pathway
  - phenotype
  - assay_method
  - tissue
  - cell
  - cell_type
  - cell_line


# ============================================================
# Modulation direction — how an intervention affects thermogenesis.
# Closed enum: the directions are finite.
# ============================================================
modulation_direction:
  - restores_normal         # 恢复正常产热
  - increases               # 增加产热
  - decreases               # 减少产热
  - inhibits_abnormal       # 抑制异常产热

# ============================================================
# Detection category — high-level classification of detection methods.
# Closed enum for aggregation. Detailed method name is free text
# in evidence_unit.detection_method.
# ============================================================
detection_category:
  - calorimetry             # 量热法
  - fluorescent_probe       # 荧光探针（如 ERthermoAc）
  - respirometry            # 呼吸测量（如 Seahorse）
  - thermal_imaging         # 热成像
  - biochemical_assay       # 生化检测
  - genetic_reporter        # 基因报告系统
  - other

# ============================================================
# Draft entry status — lifecycle of a draft entry.
# ============================================================
draft_entry_status:
  - draft
  - needs_review
