schema_version: "0.1.0"
contract_version: "2026-06-26"
description: "Trusted and non-trusted output contracts for V2."

trusted_outputs:
  review_export:
    file: "09_export/review_export.json"
    trusted: true
    human_review_required: true
    description: "Final machine-readable output after human review."

candidate_outputs:
  evidence_units:
    file: "03_evidence/evidence_units.jsonl"
    trusted: false
    human_review_required: true
    description: "Evidence candidates and structured evidence nodes."
  evidence_relations:
    file: "04_relations/evidence_relations.json"
    trusted: false
    human_review_required: true
    description: "Candidate relations among evidence units."
  context_packs:
    file: "05_context/context_packs.jsonl"
    trusted: false
    human_review_required: false
    description: "LLM input packages built from evidence and source blocks."
  draft_entries:
    file: "06_draft/draft_entries.jsonl"
    trusted: false
    human_review_required: true
    description: "Candidate structured entries generated from context packs."
  verifier_report:
    file: "07_verification/verifier_report.json"
    trusted: false
    human_review_required: false
    description: "Quality report before human review."
  review_state:
    file: "08_review/review_state.json"
    trusted: false
    human_review_required: true
    description: "Intermediate review state used to export final review_export."

source_outputs:
  raw_parse:
    file: "01_raw_parse/raw_parse.json"
    trusted: false
    description: "Raw parser or OCR output."
  source_blocks:
    file: "02_source/source_blocks.jsonl"
    trusted: false
    description: "Normalized source text blocks used by downstream stages."
  document_structure:
    file: "02_source/document_structure.json"
    trusted: false
    description: "Document section, figure, and table structure map."
