schema_version: "0.1.0"
contract_version: "2026-06-26"
description: "Stage-by-file contracts. Each stage reads fixed inputs and writes fixed outputs."

stages:
  raw_parse:
    producer: "src/parsing"
    inputs:
      - "input/*.pdf"
    outputs:
      - "01_raw_parse/raw_parse.json"
    failure_log: "logs/failures.jsonl"
    trusted_output: false
    human_edit_allowed: false

  source_normalization:
    producer: "src/parsing"
    inputs:
      - "01_raw_parse/raw_parse.json"
      - "contracts/*"
    outputs:
      - "02_source/source_blocks.jsonl"
      - "02_source/document_structure.json"
    failure_log: "logs/failures.jsonl"
    trusted_output: false
    human_edit_allowed: false

  evidence_units:
    producer: "src/evidence"
    inputs:
      - "02_source/source_blocks.jsonl"
      - "02_source/document_structure.json"
      - "contracts/*"
    outputs:
      - "03_evidence/evidence_units.jsonl"
    failure_log: "logs/failures.jsonl"
    trusted_output: false
    human_edit_allowed: false

  evidence_relations:
    producer: "src/relations"
    inputs:
      - "03_evidence/evidence_units.jsonl"
      - "contracts/*"
    outputs:
      - "04_relations/evidence_relations.json"
    failure_log: "logs/failures.jsonl"
    trusted_output: false
    human_edit_allowed: false

  context_packs:
    producer: "src/context"
    inputs:
      - "02_source/source_blocks.jsonl"
      - "03_evidence/evidence_units.jsonl"
      - "04_relations/evidence_relations.json"
      - "contracts/*"
    outputs:
      - "05_context/context_packs.jsonl"
    failure_log: "logs/failures.jsonl"
    trusted_output: false
    human_edit_allowed: false

  draft_entries:
    producer: "src/drafting"
    inputs:
      - "05_context/context_packs.jsonl"
      - "03_evidence/evidence_units.jsonl"
      - "contracts/*"
    outputs:
      - "06_draft/draft_entries.jsonl"
    failure_log: "logs/failures.jsonl"
    trusted_output: false
    human_edit_allowed: false

  verifier_report:
    producer: "src/verification"
    inputs:
      - "06_draft/draft_entries.jsonl"
      - "03_evidence/evidence_units.jsonl"
      - "04_relations/evidence_relations.json"
      - "contracts/*"
    outputs:
      - "07_verification/verifier_report.json"
    failure_log: "logs/failures.jsonl"
    trusted_output: false
    human_edit_allowed: false
    may_modify_upstream_outputs: false

  review_workspace:
    producer: "src/review"
    inputs:
      - "06_draft/draft_entries.jsonl"
      - "03_evidence/evidence_units.jsonl"
      - "07_verification/verifier_report.json"
      - "02_source/source_blocks.jsonl"
      - "contracts/*"
    outputs:
      - "08_review/review.html"
      - "08_review/review_state.json"
    failure_log: "logs/failures.jsonl"
    trusted_output: false
    human_edit_allowed: true
    may_modify_upstream_outputs: false

  review_export:
    producer: "src/export"
    inputs:
      - "08_review/review_state.json"
      - "03_evidence/evidence_units.jsonl"
      - "06_draft/draft_entries.jsonl"
      - "07_verification/verifier_report.json"
      - "contracts/*"
    outputs:
      - "09_export/review_export.json"
    failure_log: "logs/failures.jsonl"
    trusted_output: true
    human_edit_allowed: false
    may_modify_upstream_outputs: false
