schema_version: "0.1.0"
contract_version: "2026-06-26"
description: "Field registry. Prompts, validation, review UI, and exports should reference this file."

common:
  schema_version:
    type: string
    required: true
  contract_version:
    type: string
    required: true
  paper_id:
    type: string
    required: true

source_block:
  block_id:
    type: string
    required: true
  paper_id:
    type: string
    required: true
  source_block_id:
    type: string
    required: true
  page:
    type: integer
    required: false
  section:
    type: string
    required: false
  section_title:
    type: string
    required: false
  section_type:
    type: enum
    dictionary: section_type
    required: true
  text:
    type: string
    required: true
  source_type:
    type: enum
    values: [paragraph, figure, table]
    required: true
  figure_number:
    type: string
    required: false
  img_path:
    type: string
    required: false
  image_caption:
    type: array
    required: false
  image_footnote:
    type: array
    required: false
  chart_caption:
    type: array
    required: false
  chart_footnote:
    type: array
    required: false
  mineru_type:
    type: string
    required: false

evidence_unit:
  evidence_id:
    type: string
    required: true
  paper_id:
    type: string
    required: true
  evidence_type:
    type: enum
    dictionary: evidence_type
    required: true
  claim:
    type: string
    required: true
  structured_fields:
    type: object
    required: true
    description: "Evidence-type-specific fields for one of the seven scientific questions."
  raw_entities:
    type: array
    required: true
    item_schema:
      raw_name:
        type: string
        required: true
      entity_type:
        type: enum
        dictionary: entity_type
        required: true
      role:
        type: string
        required: false
  experimental_model:
    type: object
    required: true
    fields:
      model_level:
        type: enum
        values:
          - cell
          - tissue
          - organoid
          - animal
          - human_sample
          - clinical_patient
          - in_silico
          - unknown
        required: true
      model_name:
        type: string
        required: false
      species:
        type: string
        required: false
      tissue_or_cell_type:
        type: string
        required: false
      in_vivo_or_in_vitro:
        type: enum
        values: [in_vivo, in_vitro, ex_vivo, in_silico, unknown]
        required: false
  condition_context:
    type: object
    required: true
    fields:
      dose:
        type: string
        required: false
      duration:
        type: string
        required: false
      temperature:
        type: string
        required: false
      oxygen_condition:
        type: string
        required: false
      co_treatment:
        type: string
        required: false
  source_trace:
    type: object
    required: true
    fields:
      source_block_ids:
        type: array
        required: true
      quote:
        type: string
        required: true
      page:
        type: integer
        required: false
      section:
        type: string
        required: false
      figure_or_table:
        type: string
        required: false
      char_start:
        type: integer
        required: false
      char_end:
        type: integer
        required: false
  polarity:
    type: enum
    values: [positive, negative, neutral, mixed, unclear]
    required: true
  statistics:
    type: object
    required: true
    fields:
      p_value:
        type: string
        required: false
      effect_size:
        type: string
        required: false
      sample_size:
        type: integer
        required: false
  measurement:
    type: object
    required: true
    fields:
      method:
        type: string
        required: false
      measured_variable:
        type: string
        required: false
      measured_value:
        type: string
        required: false
  extraction_meta:
    type: object
    required: true
    fields:
      method:
        type: string
        required: true
      confidence:
        type: number
        required: false
      consensus_votes:
        type: integer
        required: false
      consensus_similarity:
        type: number
        required: false
      prompt_version:
        type: string
        required: false
  review_coverage:
    type: object
    required: true
    fields:
      status:
        type: enum
        values:
          - unreviewed
          - reviewed_primary_support
          - covered_by_approved_entry
          - rejected_by_review
          - uncovered
          - needs_manual_check
        required: true
      covered_by_entry_ids:
        type: array
        required: false
      coverage_role:
        type: enum
        values: [primary, supporting, contradictory, background]
        required: false
  normalization_status:
    type: enum
    values: [not_normalized]
    required: true

context_pack:
  pack_id:
    type: string
    required: true
  paper_id:
    type: string
    required: true
  evidence_type:
    type: enum
    dictionary: evidence_type
    required: true
  member_evidence_ids:
    type: array
    required: true
  anchor_evidence_ids:
    type: array
    required: true
  source_block_ids:
    type: array
    required: true
  pack_reason:
    type: string
    required: true
  missing_context:
    type: array
    required: true

draft_entry:
  entry_id:
    type: string
    required: true
  paper_id:
    type: string
    required: true
  evidence_type:
    type: enum
    dictionary: evidence_type
    required: true
  main_claim:
    type: string
    required: true
  structured_fields:
    type: object
    required: true
  evidence_links:
    type: array
    required: true
  experimental_model_summary:
    type: object
    required: true
  review_questions:
    type: array
    required: true
  uncertainty_map:
    type: object
    required: true
  status:
    type: enum
    dictionary: draft_entry_status
    required: true

verifier_report:
  entry_results:
    type: array
    required: true
  cross_entry_issues:
    type: array
    required: true
  evidence_coverage_issues:
    type: array
    required: true
  schema_issues:
    type: array
    required: true
  recommendations:
    type: array
    required: true

review_export:
  package_id:
    type: string
    required: true
  paper_id:
    type: string
    required: true
  stage:
    type: string
    required: true
  schema_version:
    type: string
    required: true
  normalization_status:
    type: enum
    values: [not_normalized]
    required: true
  reviewed_entries:
    type: array
    required: true
    item_schema:
      entry_id:
        type: string
        required: true
      paper_id:
        type: string
        required: true
      evidence_type:
        type: enum
        dictionary: evidence_type
        required: true
      reviewed_claim:
        type: string
        required: true
      structured_fields:
        type: object
        required: true
      evidence_links:
        type: array
        required: true
      experimental_model_summary:
        type: object
        required: true
      review:
        type: object
        required: true
        fields:
          decision:
            type: enum
            values: [approved, rejected]
            required: true
  reviewed_evidence_units:
    type: array
    required: true
    item_schema:
      evidence_id:
        type: string
        required: true
      paper_id:
        type: string
        required: true
      evidence_type:
        type: enum
        dictionary: evidence_type
        required: true
      claim:
        type: string
        required: true
      structured_fields:
        type: object
        required: true
      raw_entities:
        type: array
        required: true
      experimental_model:
        type: object
        required: true
      condition_context:
        type: object
        required: true
      source_trace:
        type: object
        required: true
      review_coverage:
        type: object
        required: true
      normalization_status:
        type: enum
        values: [not_normalized]
        required: true
  review_audit:
    type: object
    required: true
    fields:
      reviewer:
        type: string
        required: true
      reviewed_at:
        type: string
        required: true
      entry_count:
        type: integer
        required: true
      approved_count:
        type: integer
        required: true
      rejected_count:
        type: integer
        required: true
      evidence_coverage_summary:
        type: object
        required: true
      notes:
        type: string
        required: true
