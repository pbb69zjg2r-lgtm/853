schema_version: "0.1.0"
contract_version: "2026-06-26"
description: "Field registry. Prompts, validation, review UI, and exports should reference this file."

common:
  schema_version:
    type: string
    required: true
  contract_version:
    type: string
    required: true
  paper_id:
    type: string
    required: true

source_block:
  block_id:
    type: string
    required: true
  paper_id:
    type: string
    required: true
  source_block_id:
    type: string
    required: true
  page:
    type: integer
    required: false
  section:
    type: string
    required: false
  section_title:
    type: string
    required: false
  section_type:
    type: enum
    dictionary: section_type
    required: true
  text:
    type: string
    required: true
  source_type:
    type: enum
    values: [paragraph, figure, table]
    required: true
  figure_number:
    type: string
    required: false

evidence_unit:
  evidence_id:
    type: string
    required: true
  paper_id:
    type: string
    required: true
  source_block_ids:
    type: array
    required: true
  evidence_type:
    type: enum
    dictionary: evidence_type
    required: true
  source_text:
    type: string
    required: true
  section_type:
    type: enum
    dictionary: section_type
    required: false

  # --- Domain core ---
  disease:
    type: string
    required: false
  thermogenesis_phenotype:
    type: string
    required: false
  mechanism:
    type: string
    required: false

  # --- Entities ---
  entities:
    type: array
    required: false
    item_schema:
      name:
        type: string
        required: true
      type:
        type: enum
        dictionary: entity_type
        required: true
      normalized_id:
        type: string
        required: false
      canonical_name:
        type: string
        required: false

  # --- Detection ---
  detection_method:
    type: string
    required: false
  detection_category:
    type: enum
    dictionary: detection_category
    required: false

  # --- Modulation ---
  modulation:
    type: object
    required: false
    fields:
      drug:
        type: string
        required: false
      target:
        type: string
        required: false
      direction:
        type: enum
        dictionary: modulation_direction
        required: false
      effect_description:
        type: string
        required: false

  # --- Quantitative ---
  statistics:
    type: object
    required: false
    fields:
      p_value:
        type: string
        required: false
      fold_change:
        type: string
        required: false
      sample_size:
        type: integer
        required: false
      effect_size:
        type: string
        required: false
      confidence_interval:
        type: string
        required: false

  # --- Study context ---
  study_design:
    type: enum
    dictionary: study_design
    required: false
  model_system:
    type: enum
    dictionary: model_system
    required: false

  # --- Quality ---
  score:
    type: object
    required: false
    fields:
      composite:
        type: number
        required: false
      grade:
        type: enum
        dictionary: evidence_grade
        required: false
      llm_confidence:
        type: number
        required: false
  review_status:
    type: enum
    dictionary: review_decision
    required: false

context_pack:
  pack_id:
    type: string
    required: true
  paper_id:
    type: string
    required: true
  task_type:
    type: string
    required: true
  anchor_evidence_ids:
    type: array
    required: true
  related_evidence_ids:
    type: array
    required: false
  source_block_ids:
    type: array
    required: true
  missing_context:
    type: array
    required: false
  expected_output:
    type: string
    required: true

draft_entry:
  entry_id:
    type: string
    required: true
  paper_id:
    type: string
    required: true
  pack_id:
    type: string
    required: true
  main_claim:
    type: string
    required: true
  structured_fields:
    type: object
    required: true
  evidence_links:
    type: array
    required: true
  status:
    type: enum
    dictionary: draft_entry_status
    required: true

review_export:
  export_id:
    type: string
    required: true
  project_id:
    type: string
    required: true
  paper_id:
    type: string
    required: true
  reviewed_entries:
    type: array
    required: true
  reviewed_evidence:
    type: array
    required: true
  review_decisions:
    type: array
    required: true
  audit_log:
    type: array
    required: false
